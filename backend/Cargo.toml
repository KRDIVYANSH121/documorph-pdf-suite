[package]
name = "omnimorph-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Hardened Rust Omni-Converter routing backend with compatibility graph, chained pipelines, weighted queues, and sandboxed execution"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bytes = "1.9"
csv = "1.3"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hex = "0.4"
http = "1.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga"] }
infer = "0.16"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
zip = { version = "9.8", default-features = false, features = ["deflate", "aes-crypto"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
