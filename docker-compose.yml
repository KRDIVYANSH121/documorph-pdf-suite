services:
  omnimorph-worker-image:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: omnimorph-worker:latest
    command: ["true"]

  omnimorph:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      OMNIMORPH_LISTEN: "0.0.0.0:8080"
      OMNIMORPH_SANDBOX_MODE: "process_isolated"
      OMNIMORPH_MAX_UPLOAD_MB: "250"
      OMNIMORPH_MAX_UNCOMPRESSED_MB: "1024"
      OMNIMORPH_LIGHT_WORKERS: "4"
      OMNIMORPH_HEAVY_WORKERS: "2"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
